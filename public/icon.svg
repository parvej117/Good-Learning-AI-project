<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle neural grid / geometric pattern in background -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />
  
  <!-- Main Emblem: Stylized Open Knowledge Book + AI Light Beacon -->
  <g transform="translate(256, 260)">
    <!-- Book Wings -->
    <path d="M-130,40 C-80,-20 -20,20 0,60 C20,20 80,-20 130,40 C140,46 140,65 125,75 C80,25 25,60 0,95 C-25,60 -80,25 -125,75 C-140,65 -140,46 -130,40 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M-120,-30 C-70,-80 -15,-40 0,0 C15,-40 70,-80 120,-30 C130,-20 130,-2 115,8 C75,-32 20,2 0,38 C-20,2 -75,-32 -115,8 C-130,-2 -130,-20 -120,-30 Z" fill="url(#accentGrad)" />
    
    <!-- Central AI Neural Spark / Star of Wisdom -->
    <g transform="translate(0, -90)">
      <!-- 4-point star -->
      <path d="M0,-48 C2,-16 16,-2 48,0 C16,2 2,16 0,48 C-2,16 -16,2 -48,0 C-16,-2 -2,-16 0,-48 Z" fill="#fef08a" filter="url(#glow)" />
      <circle cx="0" cy="0" r="10" fill="#ffffff" />
      <!-- Orbital nodes -->
      <circle cx="-55" cy="-25" r="5" fill="#38bdf8" />
      <circle cx="55" cy="-25" r="5" fill="#38bdf8" />
      <line x1="-55" y1="-25" x2="-25" y2="-12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
      <line x1="55" y1="-25" x2="25" y2="-12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    </g>
  </g>
</svg>
